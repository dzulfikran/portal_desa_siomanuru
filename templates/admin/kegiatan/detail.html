{% extends "admin/base_admin.html" %}


{% block content %}


<div class="container mt-5">


<h2>
{{kegiatan.nama}}
</h2>



<p>
Tanggal:
{{kegiatan.tanggal}}
</p>



<p>
{{kegiatan.deskripsi}}
</p>



<hr>



<h4>
Banner
</h4>


{% if kegiatan.banner %}


<img

src="/static/uploads/kegiatan/{{kegiatan.banner}}"

width="400"

class="rounded mb-4">


{% endif %}



<h4>
Dokumentasi
</h4>



<div class="row">


{% for foto in kegiatan.dokumentasi %}



<div class="col-md-3 mb-3">


<div class="card">


<img

src="/static/uploads/kegiatan/dokumentasi/{{foto.foto}}"

class="card-img-top">



<div class="card-body">


<a

href="/admin/kegiatan/hapus-foto/{{foto.id}}"

class="btn btn-danger btn-sm"

onclick="return confirm('Hapus foto ini?')">

Hapus

</a>


</div>


</div>


</div>


{% endfor %}


</div>


</div>


{% endblock %}
